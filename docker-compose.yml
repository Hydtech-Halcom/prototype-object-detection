# Module 5 - Database + dashboard. Start: docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai123
      POSTGRES_DB: production_ai
    ports: ["5432:5432"]
    volumes:
      - ./m5_schema.sql:/docker-entrypoint-initdb.d/schema.sql
  grafana:
    image: grafana/grafana:11.2.0
    restart: always
    ports: ["3000:3000"]
